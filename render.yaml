services:
  - type: web
    name: kekego-api
    runtime: python
    buildCommand: pip install -r KekeGo/requirements.txt
    startCommand: gunicorn KekeGo.wsgi:application

  - type: static
    name: kekego-student-app
    rootDir: student-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
